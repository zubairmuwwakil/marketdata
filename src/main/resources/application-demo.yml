spring:
  datasource:
    url: jdbc:h2:mem:marketlens-demo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

management:
  tracing:
    enabled: false

marketdata:
  demo:
    enabled: true
