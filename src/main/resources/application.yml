server:
  port: 8080

marketdata:
  alphavantage:
    base-url: https://www.alphavantage.co
    api-key: ${ALPHAVANTAGE_API_KEY:}
    outputsize: compact
  security:
    api-keys:
      - key: ${MARKETDATA_ADMIN_KEY:change-me-admin}
        role: ADMIN
      - key: ${MARKETDATA_USER_KEY:change-me-user}
        role: USER
  rate-limit:
    capacity: 60
    refill-tokens: 60
    refill-period: 60s
  external:
    connect-timeout: 3s
    read-timeout: 12s
    retry:
      max-attempts: 3
      backoff: 300ms
    circuit-breaker:
      failure-threshold: 5
      open-state-duration: 30s
      half-open-max-calls: 2
  providers:
    # Routing is by purpose, not one global default (ADR 0003). Both paths serve
    # daily closes — the split is sanction and quota, not latency.
    ingestion-equity: ALPHAVANTAGE   # curated watchlist: licensed, 25 calls/day
    quotes-equity: YAHOO             # dynamic per-user symbols: unlicensed, has headroom
    ingestion-crypto: BINANCE        # crypto watchlist / backfill
    quotes-crypto: BINANCE           # dynamic crypto quotes: public endpoint, 24/7
    refresh-cron: ${MARKETDATA_QUOTE_REFRESH_CRON:0 30 22 * * *}
    yahoo:
      enabled: ${MARKETDATA_YAHOO_ENABLED:true}
      base-url: https://query1.finance.yahoo.com
      # Self-imposed politeness cap, NOT a vendor-published limit: Yahoo does not
      # sanction this access, so we pick a ceiling rather than discover theirs.
      daily-budget: ${MARKETDATA_YAHOO_DAILY_BUDGET:2000}
      # Yahoo has no working batch endpoint (v7 answers 401), so a batch of N
      # symbols costs N requests. These three bound the fan-out.
      max-symbols-per-request: 50
      max-concurrency: 4
      fan-out-deadline: 8s
    binance:
      enabled: ${MARKETDATA_BINANCE_ENABLED:true}
      base-url: ${MARKETDATA_BINANCE_BASE_URL:https://api.binance.com}
      daily-budget: ${MARKETDATA_BINANCE_DAILY_BUDGET:10000}
      max-symbols-per-request: 50
      max-concurrency: 4
      fan-out-deadline: 8s
    questrade:
      enabled: ${MARKETDATA_QUESTRADE_ENABLED:true}
      base-url: ${MARKETDATA_QUESTRADE_BASE_URL:https://api01.iq.questrade.com}
      access-token: ${QUESTRADE_ACCESS_TOKEN:}
      daily-budget: ${MARKETDATA_QUESTRADE_DAILY_BUDGET:5000}
      max-symbols-per-request: 50
      max-concurrency: 4
      fan-out-deadline: 8s

  retention:
    price-candle-days: 3650
    # Demand-registered symbols nobody has asked about in this long are retired.
    tracked-symbol-days: 90
  calendar:
    nyse-holidays:
      - 2026-01-01
      - 2026-01-19
      - 2026-02-16
      - 2026-04-03
      - 2026-05-25
      - 2026-07-03
      - 2026-09-07
      - 2026-11-26
      - 2026-12-25
    nyse-early-closes:
      - 2026-11-27
      - 2026-12-24

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/marketdata}
    username: ${SPRING_DATASOURCE_USERNAME:marketdata}
    password: ${SPRING_DATASOURCE_PASSWORD:marketdata}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 0
      connection-timeout: 5000
      validation-timeout: 2000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    url: ${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/marketdata}}
    user: ${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:marketdata}}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:marketdata}}
    locations: classpath:db/migration
    connect-retries: 12
    connect-retries-interval: 5s

  cache:
    type: caffeine
    cache-names: marketCalendar, adjustedPrices

logging:
  file:
    name: logs/marketdata.log
  level:
    root: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operationsSorter: method


management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      roles: ADMIN
