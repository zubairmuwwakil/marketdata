# Render blueprint to deploy the Spring Boot API with managed Postgres

databases:
  - name: marketdata-db
    databaseName: marketdata
    plan: free

services:
  - type: web
    name: marketdata-api
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketdata-db
          property: connectionString
      - key: ALPHAVANTAGE_API_KEY
        sync: false # set in Render dashboard/CLI
